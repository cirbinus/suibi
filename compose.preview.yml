services:
  suibi-preview:
    build:
      context: .
      dockerfile: deploy/Dockerfile.preview
    container_name: suibi-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - ./data:/data
      - ./.dev.vars:/app/.dev.vars:ro
    security_opt:
      - no-new-privileges:true
